</audio>

<script>
// Camera Variables
let scale = 1;
let translateX = 0;
let translateY = 0;
const svg = document.getElementById('mainSVG');

// Smooth camera movement
function goTo(x, y, newScale, duration = 1400) {
  const startX = translateX;
  const startY = translateY;
  const startScale = scale;
  const startTime = Date.now();

  function animate() {
    const elapsed = Date.now() - startTime;
    let progress = Math.min(elapsed / duration, 1);
    const ease = 0.5 - 0.5 * Math.cos(progress * Math.PI);

    translateX = startX + (x - startX) * ease;
    translateY = startY + (y - startY) * ease;
    scale = startScale + (newScale - startScale) * ease;

    svg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    svg.style.transformOrigin = '0 0';

    if (progress < 1) requestAnimationFrame(animate);
  }
  animate();
}

// === TIMELINE - Easy to Edit ===
const timeline = [
  { time: 17,  x: -80,  y: -920, scale: 2.2, label: "Receptors" },
  { time: 20,  x: -81,  y: -920, scale: 2.6, label: "First Order Neurons" },
  { time: 30,  x: -88, y: -880, scale: 2.8, label: "Spinal Cord" },
  { time: 50,  x: -185, y: -690, scale: 3.8, label: "Medial Lemniscus" },
	{ time: 65,  x: -285, y: -190, scale: 3.8, label: "Lower Medulla" },
	  { time: 70,  x: -385, y: -190, scale: 3.8, label: "Upper Medulla" },



  // Add more below easily:
  // { time: 65, x: ..., y: ..., scale: ..., label: "..." },
];

// Audio Sync
const audio = document.getElementById('narration');

let lastTriggeredTime = -1;

function checkTimeline() {
  if (!audio || audio.paused) return;
  
  const currentTime = audio.currentTime;

  for (let item of timeline) {
    if (currentTime >= item.time && lastTriggeredTime < item.time) {
      goTo(item.x, item.y, item.scale, 1200);
      lastTriggeredTime = item.time;
      console.log(`Camera moved to: ${item.label} at ${currentTime.toFixed(1)}s`);
      break;
    }
  }
}

// Start checking when audio plays
audio.addEventListener('play', () => {
  lastTriggeredTime = -1;
  const interval = setInterval(checkTimeline, 300);

  // Clear interval when audio ends
  audio.addEventListener('ended', () => clearInterval(interval), { once: true });
});

// Reset View
function resetView() {
  goTo(0, 0, 1, 1000);
}

// Manual Focus (Optional)
function focusOn(region) {
  if (region === 'receptors') goTo(-80, -920, 2.2);
  if (region === 'first-order') goTo(-95, -720, 2.6);
  if (region === 'spinal') goTo(-100, -580, 2.8);
  if (region === 'medial-lemniscus') goTo(-185, -190, 3.8);
}
</script>
